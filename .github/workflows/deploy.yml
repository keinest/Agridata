name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy Backend to Render
      run: |
        curl -X POST https://api.render.com/deploy/svc/${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}
    
    - name: Deploy Frontend to Vercel
      run: |
        npm install -g vercel
        cd frontend
        vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Health check
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - name: Wait for deployment
      run: sleep 30
    
    - name: Check API health
      run: |
        curl -f https://agridata-api.onrender.com/health || exit 1
    
    - name: Check Frontend
      run: |
        curl -f https://agridata.vercel.app || exit 1
