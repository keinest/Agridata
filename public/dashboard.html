<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriData — Tableau de bord</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/dashboard.css">

</head>
<body>
<div class="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-seedling"></i></div>
        <span class="logo-text">AgriData</span>
      </div>
      <button class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
    </div>

    <div id="nav-menu">
      <div class="nav-section">
        <div class="nav-label">Principal</div>
        <div class="nav-item active" onclick="showPage('dashboard')" data-page="dashboard">
          <span class="nav-icon"><i class="fas fa-tachometer-alt"></i></span> Tableau de bord
        </div>
        <div class="nav-item" onclick="showPage('exploitations')" data-page="exploitations">
          <span class="nav-icon"><i class="fas fa-tractor"></i></span> Exploitations
        </div>
        <div class="nav-item" onclick="showPage('parcelles')" data-page="parcelles">
          <span class="nav-icon"><i class="fas fa-map"></i></span> Parcelles
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Données</div>
        <div class="nav-item" onclick="showPage('collecte')" data-page="collecte">
          <span class="nav-icon"><i class="fas fa-database"></i></span> Collecte de Données
        </div>
        <div class="nav-item" onclick="showPage('meteo')" data-page="meteo">
          <span class="nav-icon"><i class="fas fa-cloud-sun"></i></span> Météo
        </div>
        <div class="nav-item" onclick="showPage('analyses')" data-page="analyses">
          <span class="nav-icon"><i class="fas fa-chart-line"></i></span> Analyses
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Gestion</div>
        <div class="nav-item" onclick="showPage('alertes')" data-page="alertes">
          <span class="nav-icon"><i class="fas fa-bell"></i></span> Alertes
          <span class="nav-badge" id="alertes-count" style="display:none">0</span>
        </div>
        <div class="nav-item" onclick="showPage('rapports')" data-page="rapports">
          <span class="nav-icon"><i class="fas fa-file-alt"></i></span> Rapports
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="flex-between">
        <div class="user-mini" onclick="showProfileModal()">
          <div class="avatar" id="sidebar-avatar">JD</div>
          <div class="info">
            <div class="name" id="sidebar-name">Jean Dupont</div>
            <div class="role" id="sidebar-role">Agriculteur</div>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()" title="Déconnexion">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- ===== MAIN ===== -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title">Tableau de bord</div>
      <div class="topbar-right">
        <span class="demo-pill" id="demo-pill" style="display:none"><i class="fas fa-flask" style="font-size:0.7rem"></i> Démo</span>
        <div class="topbar-date" id="topbar-date" style="display:block"></div>
        <div class="notif-btn" onclick="showPage('alertes')" title="Alertes">
          <i class="fas fa-bell"></i>
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </div>
        <div class="topbar-user" onclick="showProfileModal()">
          <div class="avatar" id="topbar-avatar">JD</div>
          <div>
            <div class="uname" id="topbar-name">Jean Dupont</div>
            <div class="urole" id="topbar-role">Agriculteur</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content-area" id="content-area">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Titre</h3>
      <button class="modal-close" onclick="hideModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ===== TOASTS ===== -->
<div class="toast-container" id="toast-container"></div>

<script src="/assets/js/dashboard.js"></script>
</body>
</html>
