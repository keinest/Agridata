<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter des données météo - Agridata</title>
    <link rel="stylesheet" href="../assets/css/register.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="bg-gradient-to-br from-green-100 to-blue-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-lg">
        <div class="text-center mb-6">
            <i class="fas fa-cloud-sun text-4xl text-green-600"></i>
            <h2 class="text-2xl font-bold mt-2">Ajouter des données météo</h2>
        </div>
        <form id="weatherForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Exploitation</label>
                <select id="exploitationSelect" class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                    <option value="">Chargement...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Température (°C)</label>
                <input type="number" step="0.1" id="temperature" required class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="24.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Humidité (%)</label>
                <input type="number" step="0.1" id="humidity" required class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="65.0">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">Envoyer</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">Retour au <a href="/pages/dashboard.html" class="text-green-600 hover:underline">dashboard</a></p>
        <div id="errorMessage" class="mt-3 text-red-500 text-sm hidden"></div>
    </div>
    <script src="../assets/js/add-weather.js"></script>
</body>
</html>
