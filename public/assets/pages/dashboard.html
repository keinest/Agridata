<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord - Agridata</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-green-800 text-white flex flex-col">
        <div class="p-5 text-2xl font-bold border-b border-green-700">
            <i class="fas fa-seedling"></i> Agridata
        </div>
        <nav class="flex-1 p-4 space-y-4">
            <a href="#" class="flex items-center space-x-3 p-2 rounded-lg bg-green-700 text-white">
                <i class="fas fa-tachometer-alt"></i><span>Tableau de bord</span>
            </a>
            <a href="#" id="addDataBtn" class="flex items-center space-x-3 p-2 rounded-lg hover:bg-green-700 transition">
                <i class="fas fa-plus-circle"></i><span>Ajouter des données</span>
            </a>
            <a href="#" id="logoutBtn" class="flex items-center space-x-3 p-2 rounded-lg hover:bg-green-700 transition mt-auto">
                <i class="fas fa-sign-out-alt"></i><span>Déconnexion</span>
            </a>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Vue d'ensemble</h1>

        <!-- Cartes résumé -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow p-5">
                <p class="text-gray-500 text-sm">Température actuelle</p>
                <p class="text-2xl font-semibold" id="currentTemp">-- °C</p>
            </div>
            <div class="bg-white rounded-xl shadow p-5">
                <p class="text-gray-500 text-sm">Humidité air</p>
                <p class="text-2xl font-semibold" id="currentHumidity">-- %</p>
            </div>
            <div class="bg-white rounded-xl shadow p-5">
                <p class="text-gray-500 text-sm">pH du sol (moy.)</p>
                <p class="text-2xl font-semibold" id="avgPh">--</p>
            </div>
        </div>

        <!-- Graphiques -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow p-5">
                <h2 class="text-lg font-semibold mb-4">Météo (dernières 24h)</h2>
                <canvas id="weatherChart" height="200"></canvas>
            </div>
            <div class="bg-white rounded-xl shadow p-5">
                <h2 class="text-lg font-semibold mb-4">Qualité du sol</h2>
                <canvas id="soilChart" height="200"></canvas>
            </div>
        </div>

        <!-- Formulaire d'ajout (caché par défaut) -->
        <div id="dataFormSection" class="bg-white rounded-xl shadow p-6 hidden mb-8">
            <h2 class="text-xl font-semibold mb-4">Ajouter des relevés</h2>
            <form id="dataForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">Type</label>
                    <select id="dataType" class="w-full mt-1 border rounded-lg p-2">
                        <option value="weather">Météo</option>
                        <option value="soil">Qualité du sol</option>
                    </select>
                </div>
                <div id="weatherFields">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium">Température (°C)</label>
                            <input type="number" step="0.1" id="temperature" class="w-full mt-1 border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Humidité (%)</label>
                            <input type="number" step="0.1" id="humidity" class="w-full mt-1 border rounded-lg p-2">
                        </div>
                    </div>
                </div>
                <div id="soilFields" class="hidden">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium">pH</label>
                            <input type="number" step="0.1" id="ph" class="w-full mt-1 border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Humidité sol (%)</label>
                            <input type="number" step="0.1" id="soilMoisture" class="w-full mt-1 border rounded-lg p-2">
                        </div>
                    </div>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">Enregistrer</button>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/dashboard.js"></script>
</body>
</html>
